[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faultpack"
version = "1.3.0"
description = "Portable, privacy-first, verifiable reproduction packs for software failures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ateeq Ghanam" }]
keywords = ["reproducibility", "debugging", "github-actions", "testing", "developer-tools"]
dependencies = [
  "typer>=0.12,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
signing = [
  "cryptography>=42,<47",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "build>=1,<2",
  "cryptography>=42,<47",
]

[project.scripts]
faultpack = "faultpack.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/faultpack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=faultpack --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
