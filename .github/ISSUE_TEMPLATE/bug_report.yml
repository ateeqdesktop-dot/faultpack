name: Reproduction or bug report
description: Report a failure with a minimal, redacted reproduction pack.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove secrets and personal data. A FaultPack directory or sanitized command is preferred.
  - type: input
    id: version
    attributes:
      label: FaultPack version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction command or pack
      description: Include the exact command, or attach a sanitized pack.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
