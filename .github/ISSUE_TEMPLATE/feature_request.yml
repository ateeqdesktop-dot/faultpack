name: Feature request
description: Propose a focused improvement to the reproduction workflow.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What maintainer or developer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe the smallest realistic workflow that demonstrates the need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Optional proposal
      description: Share an implementation direction if you have one; the problem comes first.
