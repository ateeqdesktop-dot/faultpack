name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src
      - run: pytest
      - run: python -m build --wheel --sdist

  fixture:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install .
      - run: faultpack verify fixtures/failure-pack
      - run: faultpack diagnose fixtures/failure-pack --fail-on-findings
      - run: faultpack replay fixtures/failure-pack --report-dir fixtures/failure-report
      - run: faultpack matrix fixtures/failure-pack --profiles examples/profiles.json --report-dir fixtures/matrix-report
      - run: faultpack catalog fixtures --output fixtures/catalog.json --markdown fixtures/catalog.md
      - run: faultpack reduce fixtures/failure-pack --input fixtures/repro_input.txt --out fixtures/failure-reduced --max-runs 50
      - run: faultpack verify fixtures/failure-reduced
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faultpack-fixture-report
          path: |
            fixtures/failure-report/
            fixtures/matrix-report/
            fixtures/catalog.json
            fixtures/catalog.md
            fixtures/failure-reduced/

  smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install .
      - run: faultpack version
