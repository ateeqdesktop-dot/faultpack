name: FaultPack verification
description: Verify and replay a portable failure reproduction pack
branding:
  icon: shield
  color: blue
inputs:
  pack:
    description: Path to the FaultPack directory
    required: true
  report-dir:
    description: Directory for Markdown, SARIF, and JUnit reports
    required: false
    default: faultpack-report
  require-signature:
    description: Require a signature; use HMAC legacy mode or --public-key for Ed25519
    required: false
    default: 'false'
  public-key:
    description: Path to a PEM Ed25519 public key used to verify signature.ed25519
    required: false
    default: ''
  profiles:
    description: Optional JSON array of replay matrix profiles
    required: false
    default: ''
  interop-input:
    description: Optional agent, MCP, CI, or OpenInference/OTLP evidence file to normalize
    required: false
    default: ''
  interop-format:
    description: Evidence format or auto
    required: false
    default: auto
  interop-report-dir:
    description: Directory for interoperability reports
    required: false
    default: faultpack-interop-report
runs:
  using: composite
  steps:
    - name: Install FaultPack
      shell: bash
      run: |
        if [[ -n "${{ inputs.public-key }}" ]]; then
          python -m pip install "$GITHUB_ACTION_PATH[signing]"
        else
          python -m pip install "$GITHUB_ACTION_PATH"
        fi
    - name: Normalize external evidence (if configured)
      if: inputs.interop-input != ''
      shell: bash
      run: |
        faultpack interop "${{ inputs.interop-input }}" \
          --format "${{ inputs.interop-format }}" \
          --output "${{ inputs.interop-report-dir }}/faultpack-evidence.json" \
          --report-dir "${{ inputs.interop-report-dir }}"

    - name: Verify pack integrity
      shell: bash
      run: |
        faultpack verify "${{ inputs.pack }}" \
          ${{ inputs.require-signature == 'true' && '--require-signature' || '' }} \
          ${{ inputs.public-key != '' && format('--public-key {0}', inputs.public-key) || '' }}
    - name: Replay pack or matrix
      shell: bash
      run: |
        if [[ -n "${{ inputs.profiles }}" ]]; then
          faultpack matrix "${{ inputs.pack }}" \
            --profiles "${{ inputs.profiles }}" \
            --report-dir "${{ inputs.report-dir }}" \
            ${{ inputs.require-signature == 'true' && '--require-signature' || '' }} \
            ${{ inputs.public-key != '' && format('--public-key {0}', inputs.public-key) || '' }}
        else
          faultpack replay "${{ inputs.pack }}" \
            --report-dir "${{ inputs.report-dir }}" \
            ${{ inputs.require-signature == 'true' && '--require-signature' || '' }} \
            ${{ inputs.public-key != '' && format('--public-key {0}', inputs.public-key) || '' }}
        fi
    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: faultpack-report
        path: |
          ${{ inputs.report-dir }}/
          ${{ inputs.interop-report-dir }}/
